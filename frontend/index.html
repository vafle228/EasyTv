<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235871F3'/%3E%3Cstop offset='1' stop-color='%235345BA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='3' y='5' width='26' height='18' rx='5' fill='url(%23g)'/%3E%3Crect x='12' y='25' width='8' height='2.5' rx='1.25' fill='%230E0548'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>EasyTv</title>
    <script>
      // Apply the saved theme before the first paint, so the page doesn't flash.
      (function () {
        var choice = "system";
        try { choice = localStorage.getItem("easytv-theme") || "system"; } catch (e) {}
        var dark = choice === "dark" || (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
