[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easytv"
version = "0.1.0"
description = "Play local and YouTube videos on DLNA TVs in your network"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["easytv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
